# CI only: runs on Linux and Windows. No Google Cloud account or secrets needed.
# The full pipeline (azure-pipelines.yml) adds the image build and deploys.
trigger:
  branches: { include: [main] }
pr:
  branches: { include: [main] }

strategy:
  matrix:
    linux:
      imageName: ubuntu-latest
    windows:
      imageName: windows-latest

pool:
  vmImage: $(imageName)

steps:
  - task: UsePythonVersion@0
    inputs: { versionSpec: '3.12' }
  - script: python -m pip install -e ".[dev,api]"
    displayName: Install
  - script: python -m ruff check .
    displayName: Lint
  - script: python -m pytest -q --junitxml=test-results.xml
    displayName: Unit tests
  # Offline eval gate: keyword search on the real corpus, no API key. Fails the build if passage
  # recall drops below 0.85 (it is 0.89 today), so a chunking or scoring regression is caught.
  - script: python -m ragassist.eval.run_eval --corpus data/phak/corpus --golden data/phak/golden.jsonl --modes bm25 hybrid --min-recall 0.85
    displayName: Eval gate
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: test-results.xml
      testRunTitle: tests-$(imageName)
  - publish: eval-results
    artifact: eval-results-$(imageName)
    condition: succeededOrFailed()